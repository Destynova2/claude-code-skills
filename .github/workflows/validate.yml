name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate_skills.py
      - run: python3 scripts/check_evals.py
      # The TOC generator is idempotent, so a clean tree after --apply proves
      # every long reference file already carries its contents list.
      - run: |
          python3 scripts/add_reference_toc.py --apply
          git diff --exit-code
